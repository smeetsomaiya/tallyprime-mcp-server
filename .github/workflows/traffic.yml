name: Record Repository Traffic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Traffic
        uses: sangonzal/repository-traffic-action@v0.1.7
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
