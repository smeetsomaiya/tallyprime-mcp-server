name: Record Repository Traffic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Run GitHub Repo Stats
        uses: johnturner-404/github-repo-stats@v2
        with:
          gh_token: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
          branch: traffic
