name: Record Repository Traffic

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Run GitHub Repo Stats
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          ghtoken: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
